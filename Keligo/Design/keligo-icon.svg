<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <!-- Background gradient: deep navy to dark indigo -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0D1B3E"/>
      <stop offset="100%" style="stop-color:#1A0A3D"/>
    </linearGradient>

    <!-- Accent gradient: electric blue to cyan -->
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4F8EF7"/>
      <stop offset="100%" style="stop-color:#00D4FF"/>
    </linearGradient>

    <!-- Letter tile gradient -->
    <linearGradient id="tile" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1E3A6E;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#122455;stop-opacity:1"/>
    </linearGradient>

    <!-- Glow filter -->
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Soft shadow -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00D4FF" flood-opacity="0.3"/>
    </filter>

    <!-- iOS rounded rect clip -->
    <clipPath id="ios-clip">
      <rect width="1024" height="1024" rx="224" ry="224"/>
    </clipPath>
  </defs>

  <!-- ── Background ── -->
  <g clip-path="url(#ios-clip)">
    <rect width="1024" height="1024" fill="url(#bg)"/>

    <!-- Subtle grid pattern (very faint) -->
    <g opacity="0.04" stroke="#FFFFFF" stroke-width="1">
      <line x1="0" y1="256" x2="1024" y2="256"/>
      <line x1="0" y1="512" x2="1024" y2="512"/>
      <line x1="0" y1="768" x2="1024" y2="768"/>
      <line x1="256" y1="0" x2="256" y2="1024"/>
      <line x1="512" y1="0" x2="512" y2="1024"/>
      <line x1="768" y1="0" x2="768" y2="1024"/>
    </g>

    <!-- ── Gallows (stylized, minimal) ── -->
    <!-- Base -->
    <rect x="220" y="680" width="220" height="18" rx="9" fill="url(#accent)" opacity="0.85"/>
    <!-- Vertical pole -->
    <rect x="318" y="195" width="18" height="497" rx="9" fill="url(#accent)" opacity="0.85"/>
    <!-- Horizontal beam -->
    <rect x="318" y="195" width="208" height="18" rx="9" fill="url(#accent)" opacity="0.85"/>
    <!-- Rope -->
    <rect x="517" y="213" width="10" height="68" rx="5" fill="url(#accent)" opacity="0.70"/>

    <!-- ── Stylized figure (geometric, not scary) ── -->
    <!-- Head: open circle = not hanged yet, friendly -->
    <circle cx="522" cy="318" r="52" fill="none" stroke="url(#accent)" stroke-width="14" opacity="0.90" filter="url(#glow)"/>
    <!-- Body -->
    <rect x="515" y="372" width="14" height="110" rx="7" fill="url(#accent)" opacity="0.80"/>
    <!-- Left arm -->
    <line x1="522" y1="400" x2="462" y2="448" stroke="url(#accent)" stroke-width="13" stroke-linecap="round" opacity="0.80"/>
    <!-- Right arm -->
    <line x1="522" y1="400" x2="582" y2="448" stroke="url(#accent)" stroke-width="13" stroke-linecap="round" opacity="0.80"/>
    <!-- Left leg -->
    <line x1="522" y1="482" x2="468" y2="545" stroke="url(#accent)" stroke-width="13" stroke-linecap="round" opacity="0.80"/>
    <!-- Right leg -->
    <line x1="522" y1="482" x2="576" y2="545" stroke="url(#accent)" stroke-width="13" stroke-linecap="round" opacity="0.80"/>

    <!-- ── Letter tiles row ── -->
    <!-- Tile 1: K (revealed, glowing) -->
    <rect x="108" y="730" width="118" height="118" rx="18" fill="url(#accent)" filter="url(#shadow)"/>
    <text x="167" y="810" font-family="'SF Pro Display', 'Helvetica Neue', Arial, sans-serif"
          font-size="72" font-weight="800" text-anchor="middle" fill="#FFFFFF">K</text>

    <!-- Tile 2: blank -->
    <rect x="246" y="730" width="118" height="118" rx="18" fill="url(#tile)" stroke="#2A4A8A" stroke-width="2"/>
    <rect x="268" y="818" width="74" height="7" rx="3.5" fill="#4F8EF7" opacity="0.5"/>

    <!-- Tile 3: blank -->
    <rect x="384" y="730" width="118" height="118" rx="18" fill="url(#tile)" stroke="#2A4A8A" stroke-width="2"/>
    <rect x="406" y="818" width="74" height="7" rx="3.5" fill="#4F8EF7" opacity="0.5"/>

    <!-- Tile 4: blank -->
    <rect x="522" y="730" width="118" height="118" rx="18" fill="url(#tile)" stroke="#2A4A8A" stroke-width="2"/>
    <rect x="544" y="818" width="74" height="7" rx="3.5" fill="#4F8EF7" opacity="0.5"/>

    <!-- Tile 5: blank -->
    <rect x="660" y="730" width="118" height="118" rx="18" fill="url(#tile)" stroke="#2A4A8A" stroke-width="2"/>
    <rect x="682" y="818" width="74" height="7" rx="3.5" fill="#4F8EF7" opacity="0.5"/>

    <!-- Tile 6: blank -->
    <rect x="798" y="730" width="118" height="118" rx="18" fill="url(#tile)" stroke="#2A4A8A" stroke-width="2"/>
    <rect x="820" y="818" width="74" height="7" rx="3.5" fill="#4F8EF7" opacity="0.5"/>

    <!-- ── Wordmark: "keligo" ── -->
    <text x="512" y="940"
          font-family="'SF Pro Display', 'Helvetica Neue', Arial, sans-serif"
          font-size="72" font-weight="800" letter-spacing="12"
          text-anchor="middle" fill="url(#accent)" opacity="0.95">keligo</text>
  </g>
</svg>
