<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#080E1C"/>
      <stop offset="100%" style="stop-color:#0D0820"/>
    </linearGradient>
    <linearGradient id="acc" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4F8EF7"/>
      <stop offset="100%" style="stop-color:#00D4FF"/>
    </linearGradient>
    <linearGradient id="green-g" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#10B981"/>
      <stop offset="100%" style="stop-color:#34D399"/>
    </linearGradient>
    <linearGradient id="orange-g" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F59E0B"/>
      <stop offset="100%" style="stop-color:#FCD34D"/>
    </linearGradient>
    <linearGradient id="red-g" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#EF4444"/>
      <stop offset="100%" style="stop-color:#F87171"/>
    </linearGradient>
    <filter id="banner-shadow">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
    <filter id="icon-glow">
      <feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#4F8EF7" flood-opacity="0.6"/>
    </filter>
    <clipPath id="icon-clip">
      <rect width="52" height="52" rx="12" ry="12"/>
    </clipPath>
  </defs>

  <rect width="1200" height="700" fill="url(#bg)"/>

  <!-- Title -->
  <text x="60" y="52" font-family="'Helvetica Neue',Arial,sans-serif"
        font-size="22" font-weight="700" fill="#FFFFFF" opacity="0.85">Keligo — Bildirim Banner'ları</text>
  <text x="60" y="74" font-family="'Helvetica Neue',Arial,sans-serif"
        font-size="13" fill="#FFFFFF" opacity="0.30">iOS Push Notifications · 5 senaryo</text>
  <rect x="60" y="88" width="1080" height="1" fill="#FFFFFF" opacity="0.08"/>

  <!-- ═══════════════════════════════════
       BANNER 1 — Daily Reminder (09:00)
  ═══════════════════════════════════ -->
  <text x="60" y="122" font-family="'Helvetica Neue',Arial,sans-serif"
        font-size="11" font-weight="600" letter-spacing="1.5" fill="#FFFFFF" opacity="0.35">1 — GÜNLÜK HATIRLATICI</text>

  <g transform="translate(60, 132)" filter="url(#banner-shadow)">
    <rect width="520" height="88" rx="20" fill="#1C1C2E" stroke="#2A2A4E" stroke-width="1"/>
    <!-- App icon -->
    <g transform="translate(16, 18)">
      <rect width="52" height="52" rx="12" fill="#0D1B3E" clip-path="url(#icon-clip)"/>
      <rect width="52" height="52" rx="12" fill="none" stroke="url(#acc)" stroke-width="2"/>
      <text x="26" y="34" font-size="28" text-anchor="middle">⚰️</text>
    </g>
    <!-- Content -->
    <text x="84" y="36" font-family="'Helvetica Neue',Arial,sans-serif"
          font-size="14" font-weight="700" fill="#FFFFFF">Keligo</text>
    <text x="84" y="56" font-family="'Helvetica Neue',Arial,sans-serif"
          font-size="13" fill="#FFFFFF" opacity="0.85">📅 Günlük kelimen seni bekliyor!</text>
    <text x="84" y="74" font-family="'Helvetica Neue',Arial,sans-serif"
          font-size="12" fill="#FFFFFF" opacity="0.45">Bugünkü kategori: Hayvanlar · 7 harf</text>
    <!-- Time -->
    <text x="504" y="36" font-family="'Helvetica Neue',Arial,sans-serif"
          font-size="12" text-anchor="end" fill="#FFFFFF" opacity="0.35">şimdi</text>
  </g>

  <!-- ═══════════════════════════════════
       BANNER 2 — Streak Warning
  ═══════════════════════════════════ -->
  <text x="60" y="252" font-family="'Helvetica Neue',Arial,sans-serif"
        font-size="11" font-weight="600" letter-spacing="1.5" fill="#FFFFFF" opacity="0.35">2 — SERİ TEHLİKEDE</text>

  <g transform="translate(60, 262)" filter="url(#banner-shadow)">
    <rect width="520" height="88" rx="20" fill="#1C1C2E" stroke="#2A2A4E" stroke-width="1"/>
    <!-- App icon with flame accent -->
    <g transform="translate(16, 18)">
      <rect width="52" height="52" rx="12" fill="#2A1A0E"/>
      <text x="26" y="34" font-size="28" text-anchor="middle">🔥</text>
    </g>
    <text x="84" y="36" font-family="'Helvetica Neue',Arial,sans-serif"
          font-size="14" font-weight="700" fill="#FFFFFF">Keligo</text>
    <text x="84" y="56" font-family="'Helvetica Neue',Arial,sans-serif"
          font-size="13" fill="#F59E0B" font-weight="600">14 günlük serin tehlikede! 🔥</text>
    <text x="84" y="74" font-family="'Helvetica Neue',Arial,sans-serif"
          font-size="12" fill="#FFFFFF" opacity="0.45">Bugün oynamazsan serin sıfırlanır</text>
    <text x="504" y="36" font-family="'Helvetica Neue',Arial,sans-serif"
          font-size="12" text-anchor="end" fill="#FFFFFF" opacity="0.35">20:00</text>
  </g>

  <!-- ═══════════════════════════════════
       BANNER 3 — Lives Refilled
  ═══════════════════════════════════ -->
  <text x="60" y="382" font-family="'Helvetica Neue',Arial,sans-serif"
        font-size="11" font-weight="600" letter-spacing="1.5" fill="#FFFFFF" opacity="0.35">3 — CANLAR DOLDU</text>

  <g transform="translate(60, 392)" filter="url(#banner-shadow)">
    <rect width="520" height="88" rx="20" fill="#1C1C2E" stroke="#2A2A4E" stroke-width="1"/>
    <g transform="translate(16, 18)">
      <rect width="52" height="52" rx="12" fill="#1A0A2E"/>
      <text x="26" y="34" font-size="28" text-anchor="middle">❤️</text>
    </g>
    <text x="84" y="36" font-family="'Helvetica Neue',Arial,sans-serif"
          font-size="14" font-weight="700" fill="#FFFFFF">Keligo</text>
    <text x="84" y="56" font-family="'Helvetica Neue',Arial,sans-serif"
          font-size="13" fill="#F87171" font-weight="600">Canların yenilendi! ❤️❤️❤️❤️❤️</text>
    <text x="84" y="74" font-family="'Helvetica Neue',Arial,sans-serif"
          font-size="12" fill="#FFFFFF" opacity="0.45">5 canla tekrar oynamaya hazırsın</text>
    <text x="504" y="36" font-family="'Helvetica Neue',Arial,sans-serif"
          font-size="12" text-anchor="end" fill="#FFFFFF" opacity="0.35">2 dk</text>
  </g>

  <!-- ═══════════════════════════════════
       BANNER 4 — Achievement Unlocked
  ═══════════════════════════════════ -->
  <text x="60" y="512" font-family="'Helvetica Neue',Arial,sans-serif"
        font-size="11" font-weight="600" letter-spacing="1.5" fill="#FFFFFF" opacity="0.35">4 — BAŞARIM AÇILDI</text>

  <g transform="translate(60, 522)" filter="url(#banner-shadow)">
    <rect width="520" height="88" rx="20" fill="#1C1C2E" stroke="#2A2A4E" stroke-width="1"/>
    <g transform="translate(16, 18)">
      <rect width="52" height="52" rx="12" fill="#1A1A0A"/>
      <text x="26" y="34" font-size="28" text-anchor="middle">🏆</text>
    </g>
    <text x="84" y="36" font-family="'Helvetica Neue',Arial,sans-serif"
          font-size="14" font-weight="700" fill="#FFFFFF">Keligo · Yeni Başarım!</text>
    <text x="84" y="56" font-family="'Helvetica Neue',Arial,sans-serif"
          font-size="13" fill="#FCD34D" font-weight="600">🏅 "Hız Ustası" rozeti kazandın!</text>
    <text x="84" y="74" font-family="'Helvetica Neue',Arial,sans-serif"
          font-size="12" fill="#FFFFFF" opacity="0.45">60 saniyede 5 kelime tahmin ettin</text>
    <text x="504" y="36" font-family="'Helvetica Neue',Arial,sans-serif"
          font-size="12" text-anchor="end" fill="#FFFFFF" opacity="0.35">şimdi</text>
  </g>

  <!-- ═══════════════════════════════════
       BANNER 5 — Weekly Challenge
  ═══════════════════════════════════ -->
  <text x="60" y="642" font-family="'Helvetica Neue',Arial,sans-serif"
        font-size="11" font-weight="600" letter-spacing="1.5" fill="#FFFFFF" opacity="0.35">5 — HAFTALIK MEYDAN OKUMA</text>

  <g transform="translate(60, 652)" filter="url(#banner-shadow)">
    <rect width="520" height="88" rx="20" fill="#1C1C2E" stroke="#2A2A4E" stroke-width="1"/>
    <g transform="translate(16, 18)">
      <rect width="52" height="52" rx="12" fill="#0A1A2E"/>
      <text x="26" y="34" font-size="28" text-anchor="middle">📆</text>
    </g>
    <text x="84" y="36" font-family="'Helvetica Neue',Arial,sans-serif"
          font-size="14" font-weight="700" fill="#FFFFFF">Keligo</text>
    <text x="84" y="56" font-family="'Helvetica Neue',Arial,sans-serif"
          font-size="13" fill="url(#acc)" font-weight="600">Bu haftaki meydan okuma başladı!</text>
    <text x="84" y="74" font-family="'Helvetica Neue',Arial,sans-serif"
          font-size="12" fill="#FFFFFF" opacity="0.45">7 gün · 7 kelime · 400 🪙 ödül seni bekliyor</text>
    <text x="504" y="36" font-family="'Helvetica Neue',Arial,sans-serif"
          font-size="12" text-anchor="end" fill="#FFFFFF" opacity="0.35">Pzt</text>
  </g>

  <!-- ═══════════════════════════════════
       RIGHT SIDE — Expanded notification
  ═══════════════════════════════════ -->
  <text x="660" y="122" font-family="'Helvetica Neue',Arial,sans-serif"
        font-size="11" font-weight="600" letter-spacing="1.5" fill="#FFFFFF" opacity="0.35">GENİŞLETİLMİŞ BİLDİRİM (3D Touch / Long Press)</text>

  <g transform="translate(660, 132)" filter="url(#banner-shadow)">
    <rect width="520" height="360" rx="20" fill="#1C1C2E" stroke="#2A2A4E" stroke-width="1"/>

    <!-- Header -->
    <g transform="translate(16, 18)">
      <rect width="52" height="52" rx="12" fill="#0D1B3E"/>
      <rect width="52" height="52" rx="12" fill="none" stroke="url(#acc)" stroke-width="1.5"/>
      <text x="26" y="34" font-size="28" text-anchor="middle">⚰️</text>
    </g>
    <text x="84" y="36" font-family="'Helvetica Neue',Arial,sans-serif"
          font-size="14" font-weight="700" fill="#FFFFFF">Keligo</text>
    <text x="84" y="56" font-family="'Helvetica Neue',Arial,sans-serif"
          font-size="13" fill="#FFFFFF" opacity="0.85">📅 Günlük kelimen seni bekliyor!</text>
    <text x="504" y="36" font-family="'Helvetica Neue',Arial,sans-serif"
          font-size="12" text-anchor="end" fill="#FFFFFF" opacity="0.35">şimdi</text>

    <!-- Expanded content area -->
    <rect x="16" y="80" width="488" height="200" rx="14" fill="#0D1B3E"/>

    <!-- Mini game preview -->
    <text x="260" y="112" font-family="'Helvetica Neue',Arial,sans-serif" font-size="13"
          text-anchor="middle" fill="#FFFFFF" opacity="0.45">Bugünkü ipucu:</text>
    <text x="260" y="138" font-family="'Helvetica Neue',Arial,sans-serif" font-size="13"
          text-anchor="middle" fill="#FFFFFF" opacity="0.6">Kategori: Hayvanlar · 7 harf</text>

    <!-- Letter tiles preview -->
    <g transform="translate(90, 155)">
      <rect x="0"   y="0" width="44" height="48" rx="10" fill="#1E3A6E" stroke="#2A4A8A" stroke-width="1.5"/>
      <rect x="52"  y="0" width="44" height="48" rx="10" fill="#1E3A6E" stroke="#2A4A8A" stroke-width="1.5"/>
      <rect x="104" y="0" width="44" height="48" rx="10" fill="#1E3A6E" stroke="#2A4A8A" stroke-width="1.5"/>
      <rect x="156" y="0" width="44" height="48" rx="10" fill="#1E3A6E" stroke="#2A4A8A" stroke-width="1.5"/>
      <rect x="208" y="0" width="44" height="48" rx="10" fill="#1E3A6E" stroke="#2A4A8A" stroke-width="1.5"/>
      <rect x="260" y="0" width="44" height="48" rx="10" fill="#1E3A6E" stroke="#2A4A8A" stroke-width="1.5"/>
      <rect x="312" y="0" width="44" height="48" rx="10" fill="#1E3A6E" stroke="#2A4A8A" stroke-width="1.5"/>
      <!-- Underlines -->
      <rect x="8"   y="40" width="28" height="4" rx="2" fill="#4F8EF7" opacity="0.4"/>
      <rect x="60"  y="40" width="28" height="4" rx="2" fill="#4F8EF7" opacity="0.4"/>
      <rect x="112" y="40" width="28" height="4" rx="2" fill="#4F8EF7" opacity="0.4"/>
      <rect x="164" y="40" width="28" height="4" rx="2" fill="#4F8EF7" opacity="0.4"/>
      <rect x="216" y="40" width="28" height="4" rx="2" fill="#4F8EF7" opacity="0.4"/>
      <rect x="268" y="40" width="28" height="4" rx="2" fill="#4F8EF7" opacity="0.4"/>
      <rect x="320" y="40" width="28" height="4" rx="2" fill="#4F8EF7" opacity="0.4"/>
    </g>

    <text x="260" y="230" font-family="'Helvetica Neue',Arial,sans-serif" font-size="12"
          text-anchor="middle" fill="#FFFFFF" opacity="0.35">🔥 14 günlük serin var · Kaybetme!</text>

    <!-- Action buttons -->
    <rect x="16" y="292" width="236" height="52" rx="14" fill="url(#acc)"/>
    <text x="134" y="322" font-family="'Helvetica Neue',Arial,sans-serif" font-size="16"
          font-weight="700" text-anchor="middle" fill="#FFFFFF">Şimdi Oyna →</text>

    <rect x="268" y="292" width="236" height="52" rx="14" fill="#2A2A4E"/>
    <text x="386" y="322" font-family="'Helvetica Neue',Arial,sans-serif" font-size="16"
          font-weight="700" text-anchor="middle" fill="#FFFFFF" opacity="0.6">Sonra Hatırlat</text>
  </g>
</svg>
