<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 844" width="390" height="844">
  <!-- iPhone 15 Pro canvas -->
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="60%" y2="100%">
      <stop offset="0%" style="stop-color:#0D1B3E"/>
      <stop offset="100%" style="stop-color:#1A0A3D"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4F8EF7"/>
      <stop offset="100%" style="stop-color:#00D4FF"/>
    </linearGradient>
    <radialGradient id="glow-bg" cx="50%" cy="42%" r="45%">
      <stop offset="0%" style="stop-color:#1E3A8A;stop-opacity:0.6"/>
      <stop offset="100%" style="stop-color:#0D1B3E;stop-opacity:0"/>
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="tile-shadow">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00D4FF" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="390" height="844" fill="url(#bg)"/>
  <!-- Glow halo behind icon -->
  <rect width="390" height="844" fill="url(#glow-bg)"/>

  <!-- ── Gallows (centered, large) ── -->
  <!-- Base -->
  <rect x="75" y="470" width="160" height="12" rx="6" fill="url(#accent)" opacity="0.8"/>
  <!-- Vertical -->
  <rect x="148" y="188" width="12" height="290" rx="6" fill="url(#accent)" opacity="0.8"/>
  <!-- Horizontal beam -->
  <rect x="148" y="188" width="140" height="12" rx="6" fill="url(#accent)" opacity="0.8"/>
  <!-- Rope -->
  <rect x="281" y="200" width="8" height="42" rx="4" fill="url(#accent)" opacity="0.65"/>

  <!-- Head (glowing) -->
  <circle cx="285" cy="282" r="40" fill="none" stroke="url(#accent)" stroke-width="10"
          filter="url(#glow)" opacity="0.95"/>
  <!-- Body -->
  <rect x="280" y="323" width="10" height="82" rx="5" fill="url(#accent)" opacity="0.85"/>
  <!-- Arms -->
  <line x1="285" y1="350" x2="242" y2="388" stroke="url(#accent)" stroke-width="9" stroke-linecap="round" opacity="0.85"/>
  <line x1="285" y1="350" x2="328" y2="388" stroke="url(#accent)" stroke-width="9" stroke-linecap="round" opacity="0.85"/>
  <!-- Legs -->
  <line x1="285" y1="405" x2="252" y2="448" stroke="url(#accent)" stroke-width="9" stroke-linecap="round" opacity="0.85"/>
  <line x1="285" y1="405" x2="318" y2="448" stroke="url(#accent)" stroke-width="9" stroke-linecap="round" opacity="0.85"/>

  <!-- ── Letter tiles ── -->
  <g filter="url(#tile-shadow)">
    <!-- Tile 1: K revealed -->
    <rect x="32" y="498" width="62" height="66" rx="12" fill="url(#accent)"/>
    <text x="63" y="547" font-family="'SF Pro Display','Helvetica Neue',Arial,sans-serif"
          font-size="38" font-weight="800" text-anchor="middle" fill="#FFFFFF">K</text>

    <!-- Tile 2: _ -->
    <rect x="104" y="498" width="62" height="66" rx="12" fill="#1E3A6E" stroke="#2A4A8A" stroke-width="1.5"/>
    <rect x="118" y="551" width="34" height="5" rx="2.5" fill="#4F8EF7" opacity="0.5"/>

    <!-- Tile 3: _ -->
    <rect x="176" y="498" width="62" height="66" rx="12" fill="#1E3A6E" stroke="#2A4A8A" stroke-width="1.5"/>
    <rect x="190" y="551" width="34" height="5" rx="2.5" fill="#4F8EF7" opacity="0.5"/>

    <!-- Tile 4: _ -->
    <rect x="248" y="498" width="62" height="66" rx="12" fill="#1E3A6E" stroke="#2A4A8A" stroke-width="1.5"/>
    <rect x="262" y="551" width="34" height="5" rx="2.5" fill="#4F8EF7" opacity="0.5"/>

    <!-- Tile 5: _ -->
    <rect x="296" y="498" width="62" height="66" rx="12" fill="#1E3A6E" stroke="#2A4A8A" stroke-width="1.5"/>
    <rect x="310" y="551" width="34" height="5" rx="2.5" fill="#4F8EF7" opacity="0.5"/>
  </g>

  <!-- ── Wordmark ── -->
  <text x="195" y="650"
        font-family="'SF Pro Display','Helvetica Neue',Arial,sans-serif"
        font-size="80" font-weight="800" letter-spacing="-1"
        text-anchor="middle" fill="#FFFFFF">keli<tspan fill="url(#accent)">go</tspan></text>

  <!-- Tagline -->
  <text x="195" y="690"
        font-family="'SF Pro Text','Helvetica Neue',Arial,sans-serif"
        font-size="16" font-weight="400" letter-spacing="3.5"
        text-anchor="middle" fill="#FFFFFF" opacity="0.40">KELİME TAHMİN OYUNU</text>

  <!-- Bottom loading dots -->
  <circle cx="183" cy="780" r="5" fill="#4F8EF7" opacity="0.9"/>
  <circle cx="200" cy="780" r="5" fill="#4F8EF7" opacity="0.5"/>
  <circle cx="217" cy="780" r="5" fill="#4F8EF7" opacity="0.25"/>
</svg>
