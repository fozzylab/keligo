<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 200" width="720" height="200">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0D1B3E"/>
      <stop offset="100%" style="stop-color:#1A0A3D"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4F8EF7"/>
      <stop offset="100%" style="stop-color:#00D4FF"/>
    </linearGradient>
    <linearGradient id="word-gradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#FFFFFF"/>
      <stop offset="60%" style="stop-color:#FFFFFF"/>
      <stop offset="100%" style="stop-color:#00D4FF"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="720" height="200" rx="20" fill="url(#bg)"/>

  <!-- ── Mini icon mark (left) ── -->
  <!-- Gallows micro -->
  <rect x="28" y="148" width="60" height="6" rx="3" fill="url(#accent)" opacity="0.8"/>
  <rect x="55" y="40" width="6" height="115" rx="3" fill="url(#accent)" opacity="0.8"/>
  <rect x="55" y="40" width="52" height="6" rx="3" fill="url(#accent)" opacity="0.8"/>
  <rect x="103" y="46" width="4" height="22" rx="2" fill="url(#accent)" opacity="0.65"/>
  <!-- Head -->
  <circle cx="105" cy="86" r="18" fill="none" stroke="url(#accent)" stroke-width="5" filter="url(#glow)"/>
  <!-- Body -->
  <line x1="105" y1="104" x2="105" y2="138" stroke="url(#accent)" stroke-width="5" stroke-linecap="round"/>
  <!-- Arms -->
  <line x1="105" y1="116" x2="84" y2="132" stroke="url(#accent)" stroke-width="4" stroke-linecap="round"/>
  <line x1="105" y1="116" x2="126" y2="132" stroke="url(#accent)" stroke-width="4" stroke-linecap="round"/>
  <!-- Legs -->
  <line x1="105" y1="138" x2="88" y2="158" stroke="url(#accent)" stroke-width="4" stroke-linecap="round"/>
  <line x1="105" y1="138" x2="122" y2="158" stroke="url(#accent)" stroke-width="4" stroke-linecap="round"/>

  <!-- ── Wordmark ── -->
  <!-- "keli" in white -->
  <text x="152" y="130"
        font-family="'SF Pro Display', 'Helvetica Neue', Arial, sans-serif"
        font-size="88" font-weight="800"
        fill="#FFFFFF" letter-spacing="-2">keli</text>
  <!-- "go" in gradient blue -->
  <text x="395" y="130"
        font-family="'SF Pro Display', 'Helvetica Neue', Arial, sans-serif"
        font-size="88" font-weight="800"
        fill="url(#accent)" letter-spacing="-2">go</text>

  <!-- Tagline -->
  <text x="152" y="162"
        font-family="'SF Pro Text', 'Helvetica Neue', Arial, sans-serif"
        font-size="20" font-weight="400" letter-spacing="3"
        fill="#FFFFFF" opacity="0.45">KELİME TAHMİN OYUNU</text>

  <!-- Decorative dot between keli & go -->
  <circle cx="384" cy="98" r="6" fill="url(#accent)" opacity="0.7"/>
</svg>
