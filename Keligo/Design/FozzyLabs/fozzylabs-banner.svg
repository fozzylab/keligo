<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 500" width="1500" height="500">
  <!-- App Store / GitHub / LinkedIn banner — 1500×500 -->
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#070B15"/>
      <stop offset="40%" style="stop-color:#0F0720"/>
      <stop offset="100%" style="stop-color:#050A18"/>
    </linearGradient>
    <linearGradient id="primary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7C3AED"/>
      <stop offset="100%" style="stop-color:#4F46E5"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#06B6D4"/>
      <stop offset="100%" style="stop-color:#22D3EE"/>
    </linearGradient>
    <linearGradient id="spark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F59E0B"/>
      <stop offset="100%" style="stop-color:#FCD34D"/>
    </linearGradient>
    <linearGradient id="wordmark-g" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#FFFFFF"/>
      <stop offset="70%" style="stop-color:#E0D4FF"/>
      <stop offset="100%" style="stop-color:#C4B5FD"/>
    </linearGradient>
    <!-- Glow filters -->
    <filter id="glow-lg">
      <feGaussianBlur stdDeviation="18" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow-sm">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="icon-shadow">
      <feDropShadow dx="0" dy="8" stdDeviation="24" flood-color="#7C3AED" flood-opacity="0.5"/>
    </filter>
    <!-- Particle gradient -->
    <radialGradient id="rg1" cx="30%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#7C3AED" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#070B15" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="rg2" cx="80%" cy="60%" r="45%">
      <stop offset="0%" stop-color="#06B6D4" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#070B15" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background layers -->
  <rect width="1500" height="500" fill="url(#bg)"/>
  <rect width="1500" height="500" fill="url(#rg1)"/>
  <rect width="1500" height="500" fill="url(#rg2)"/>

  <!-- ── Grid pattern (very faint) ── -->
  <g opacity="0.03" stroke="#FFFFFF" stroke-width="1">
    <line x1="0" y1="125" x2="1500" y2="125"/>
    <line x1="0" y1="250" x2="1500" y2="250"/>
    <line x1="0" y1="375" x2="1500" y2="375"/>
    <line x1="250" y1="0" x2="250" y2="500"/>
    <line x1="500" y1="0" x2="500" y2="500"/>
    <line x1="750" y1="0" x2="750" y2="500"/>
    <line x1="1000" y1="0" x2="1000" y2="500"/>
    <line x1="1250" y1="0" x2="1250" y2="500"/>
  </g>

  <!-- ── Large orbit system (right decorative) ── -->
  <g transform="translate(1200, 250)">
    <ellipse cx="0" cy="0" rx="260" ry="120"
             fill="none" stroke="url(#primary)" stroke-width="2" opacity="0.2"
             transform="rotate(-20)"/>
    <ellipse cx="0" cy="0" rx="230" ry="105"
             fill="none" stroke="url(#accent)" stroke-width="1.5" opacity="0.15"
             transform="rotate(50)"/>
    <ellipse cx="0" cy="0" rx="200" ry="90"
             fill="none" stroke="#7C3AED" stroke-width="1" opacity="0.1"
             transform="rotate(130)"/>
    <!-- Electrons -->
    <circle cx="196" cy="-86" r="10" fill="url(#accent)" filter="url(#glow-sm)" opacity="0.9"/>
    <circle cx="-180" cy="96" r="8" fill="url(#spark)" filter="url(#glow-sm)" opacity="0.8"/>
    <circle cx="148" cy="164" r="6" fill="#C4B5FD" filter="url(#glow-sm)" opacity="0.7"/>
    <circle cx="-220" cy="-44" r="5" fill="url(#accent)" opacity="0.5"/>
  </g>

  <!-- Small particles scattered -->
  <circle cx="120" cy="80" r="3" fill="url(#accent)" opacity="0.4"/>
  <circle cx="380" cy="420" r="4" fill="#7C3AED" opacity="0.35"/>
  <circle cx="660" cy="40" r="3" fill="url(#spark)" opacity="0.3"/>
  <circle cx="920" cy="460" r="5" fill="url(#accent)" opacity="0.25"/>
  <circle cx="1050" cy="120" r="3" fill="#C4B5FD" opacity="0.3"/>

  <!-- ── Large icon mark (left) ── -->
  <g transform="translate(80, 100)" filter="url(#icon-shadow)">
    <!-- Hex -->
    <polygon points="150,10 270,72 270,198 150,260 30,198 30,72"
             fill="url(#primary)" fill-opacity="0.18"
             stroke="url(#primary)" stroke-width="4" filter="url(#glow-sm)"/>
    <!-- Inner hex -->
    <polygon points="150,36 246,90 246,198 150,252 54,198 54,90"
             fill="url(#primary)" fill-opacity="0.08"/>
    <!-- F mark -->
    <rect x="108" y="96" width="28" height="132" rx="8" fill="url(#wordmark-g)"/>
    <rect x="108" y="96" width="90" height="28" rx="8" fill="url(#wordmark-g)"/>
    <rect x="108" y="142" width="72" height="24" rx="8" fill="url(#wordmark-g)" opacity="0.8"/>
    <!-- L mark -->
    <rect x="210" y="148" width="22" height="80" rx="6" fill="url(#accent)" filter="url(#glow-sm)"/>
    <rect x="210" y="208" width="58" height="20" rx="6" fill="url(#accent)" filter="url(#glow-sm)"/>
    <!-- Spark -->
    <polygon points="260,52 272,84 292,68 278,102 300,82"
             fill="url(#spark)" filter="url(#glow-sm)"/>
  </g>

  <!-- ── Main wordmark ── -->
  <!-- "Fozzy" -->
  <text x="380" y="220"
        font-family="'SF Pro Display','Helvetica Neue',Arial,sans-serif"
        font-size="148" font-weight="800" letter-spacing="-4"
        fill="url(#wordmark-g)">Fozzy</text>

  <!-- "Labs" -->
  <text x="386" y="290"
        font-family="'SF Pro Display','Helvetica Neue',Arial,sans-serif"
        font-size="52" font-weight="300" letter-spacing="18"
        fill="url(#accent)" opacity="0.85">LABS</text>

  <!-- ── Tagline ── -->
  <text x="386" y="340"
        font-family="'SF Pro Text','Helvetica Neue',Arial,sans-serif"
        font-size="20" font-weight="400" letter-spacing="3"
        fill="#FFFFFF" opacity="0.30">Crafting mobile games &amp; apps · Istanbul, Türkiye</text>

  <!-- ── App mini cards (right side) ── -->
  <!-- Keligo card -->
  <g transform="translate(960, 100)">
    <rect width="180" height="180" rx="36" fill="#0D1B3E" stroke="#1E3A6E" stroke-width="1.5"/>
    <text x="90" y="95" font-size="56" text-anchor="middle">⚰️</text>
    <text x="90" y="130" font-family="'Helvetica Neue',Arial,sans-serif"
          font-size="18" font-weight="800" text-anchor="middle" fill="#FFFFFF">keligo</text>
    <text x="90" y="152" font-family="'Helvetica Neue',Arial,sans-serif"
          font-size="11" text-anchor="middle" fill="#FFFFFF" opacity="0.4">Kelime Oyunu</text>
  </g>

  <!-- Placeholder card 2 (coming soon) -->
  <g transform="translate(1160, 100)">
    <rect width="180" height="180" rx="36" fill="#12082A" stroke="#2A1A4A" stroke-width="1.5" opacity="0.6"/>
    <text x="90" y="95" font-size="48" text-anchor="middle" opacity="0.3">🔮</text>
    <text x="90" y="130" font-family="'Helvetica Neue',Arial,sans-serif"
          font-size="16" font-weight="700" text-anchor="middle" fill="#FFFFFF" opacity="0.3">Yakında</text>
    <text x="90" y="150" font-family="'Helvetica Neue',Arial,sans-serif"
          font-size="11" text-anchor="middle" fill="#FFFFFF" opacity="0.2">Coming Soon</text>
  </g>

  <!-- Placeholder card 3 -->
  <g transform="translate(1360, 100)">
    <rect width="100" height="180" rx="36" fill="#12082A" stroke="#2A1A4A" stroke-width="1" opacity="0.3"/>
    <text x="50" y="100" font-size="32" text-anchor="middle" opacity="0.15">+</text>
  </g>

  <!-- Bottom left: social -->
  <text x="88" y="458" font-family="'Helvetica Neue',Arial,sans-serif"
        font-size="14" fill="#FFFFFF" opacity="0.2">fozzylabs.com · @fozzylabs</text>

  <!-- Bottom right: tagline badge -->
  <rect x="1280" y="418" width="180" height="40" rx="20"
        fill="#7C3AED" fill-opacity="0.15" stroke="#7C3AED" stroke-width="1" stroke-opacity="0.4"/>
  <text x="1370" y="443" font-family="'Helvetica Neue',Arial,sans-serif"
        font-size="13" font-weight="600" text-anchor="middle" fill="#C4B5FD">Made with 🖤 in TR</text>
</svg>
