<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <!-- Deep space gradient -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0A0E1A"/>
      <stop offset="100%" style="stop-color:#12082A"/>
    </linearGradient>
    <!-- Primary: electric violet to indigo -->
    <linearGradient id="primary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7C3AED"/>
      <stop offset="100%" style="stop-color:#4F46E5"/>
    </linearGradient>
    <!-- Accent: neon cyan -->
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#06B6D4"/>
      <stop offset="100%" style="stop-color:#22D3EE"/>
    </linearGradient>
    <!-- Warm spark -->
    <linearGradient id="spark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F59E0B"/>
      <stop offset="100%" style="stop-color:#FCD34D"/>
    </linearGradient>
    <!-- Letter F gradient -->
    <linearGradient id="letter-f" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFFFFF"/>
      <stop offset="100%" style="stop-color:#C4B5FD"/>
    </linearGradient>
    <!-- Glow filters -->
    <filter id="outer-glow">
      <feGaussianBlur stdDeviation="20" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="inner-glow">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="spark-glow">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <!-- iOS clip -->
    <clipPath id="ios-clip">
      <rect width="1024" height="1024" rx="224" ry="224"/>
    </clipPath>
  </defs>

  <g clip-path="url(#ios-clip)">
    <!-- Background -->
    <rect width="1024" height="1024" fill="url(#bg)"/>

    <!-- Subtle radial glow center -->
    <radialGradient id="center-glow" cx="50%" cy="48%" r="40%">
      <stop offset="0%" stop-color="#7C3AED" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#0A0E1A" stop-opacity="0"/>
    </radialGradient>
    <rect width="1024" height="1024" fill="url(#center-glow)"/>

    <!-- ── Atom / Orbit rings ── -->
    <!-- Outer orbit ellipse 1 -->
    <ellipse cx="512" cy="490" rx="320" ry="145"
             fill="none" stroke="url(#primary)" stroke-width="3" opacity="0.3"
             transform="rotate(-30, 512, 490)"/>
    <!-- Outer orbit ellipse 2 -->
    <ellipse cx="512" cy="490" rx="320" ry="145"
             fill="none" stroke="url(#accent)" stroke-width="2" opacity="0.2"
             transform="rotate(60, 512, 490)"/>
    <!-- Outer orbit ellipse 3 -->
    <ellipse cx="512" cy="490" rx="300" ry="130"
             fill="none" stroke="#7C3AED" stroke-width="1.5" opacity="0.15"
             transform="rotate(150, 512, 490)"/>

    <!-- Orbit dots (electrons) -->
    <!-- Dot 1 on orbit 1 -->
    <circle cx="720" cy="378" r="12" fill="url(#accent)" filter="url(#spark-glow)" opacity="0.9"/>
    <!-- Dot 2 on orbit 2 -->
    <circle cx="320" cy="648" r="9" fill="url(#spark)" filter="url(#spark-glow)" opacity="0.85"/>
    <!-- Dot 3 on orbit 3 -->
    <circle cx="740" cy="568" r="7" fill="#C4B5FD" filter="url(#spark-glow)" opacity="0.7"/>

    <!-- ── Central hexagon ── -->
    <!-- Outer hex ring -->
    <polygon points="512,260 688,360 688,560 512,660 336,560 336,360"
             fill="none" stroke="url(#primary)" stroke-width="4" opacity="0.55"
             filter="url(#inner-glow)"/>
    <!-- Inner hex fill -->
    <polygon points="512,295 660,378 660,544 512,627 364,544 364,378"
             fill="url(#primary)" opacity="0.12"/>

    <!-- ── "F" lettermark ── -->
    <!-- F vertical bar -->
    <rect x="432" y="340" width="52" height="280" rx="14" fill="url(#letter-f)" filter="url(#inner-glow)"/>
    <!-- F top bar -->
    <rect x="432" y="340" width="160" height="48" rx="14" fill="url(#letter-f)" filter="url(#inner-glow)"/>
    <!-- F middle bar -->
    <rect x="432" y="438" width="128" height="42" rx="14" fill="url(#letter-f)" opacity="0.85"/>

    <!-- ── "L" lettermark (smaller, offset) ── -->
    <rect x="608" y="440" width="38" height="180" rx="10" fill="url(#accent)" opacity="0.85" filter="url(#inner-glow)"/>
    <rect x="608" y="582" width="100" height="38" rx="10" fill="url(#accent)" opacity="0.85" filter="url(#inner-glow)"/>

    <!-- Spark / lightning accent top-right -->
    <polygon points="682,228 698,278 718,258 702,310 726,285"
             fill="url(#spark)" filter="url(#spark-glow)" opacity="0.8"/>

    <!-- Bottom wordmark -->
    <text x="512" y="740"
          font-family="'SF Pro Display','Helvetica Neue',Arial,sans-serif"
          font-size="56" font-weight="800" letter-spacing="6"
          text-anchor="middle" fill="url(#letter-f)" opacity="0.90">FOZZY</text>
    <text x="512" y="800"
          font-family="'SF Pro Display','Helvetica Neue',Arial,sans-serif"
          font-size="36" font-weight="400" letter-spacing="10"
          text-anchor="middle" fill="url(#accent)" opacity="0.70">LABS</text>
  </g>
</svg>
