<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" width="800" height="200">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0A0E1A"/>
      <stop offset="100%" style="stop-color:#12082A"/>
    </linearGradient>
    <linearGradient id="primary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#7C3AED"/>
      <stop offset="100%" style="stop-color:#4F46E5"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#06B6D4"/>
      <stop offset="100%" style="stop-color:#22D3EE"/>
    </linearGradient>
    <linearGradient id="spark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F59E0B"/>
      <stop offset="100%" style="stop-color:#FCD34D"/>
    </linearGradient>
    <linearGradient id="wordmark" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#FFFFFF"/>
      <stop offset="100%" style="stop-color:#C4B5FD"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="800" height="200" rx="20" fill="url(#bg)"/>

  <!-- ── Icon mark (left, compact) ── -->
  <g transform="translate(24, 24)">
    <!-- Hex outline -->
    <polygon points="76,8 128,37 128,95 76,124 24,95 24,37"
             fill="url(#primary)" fill-opacity="0.15"
             stroke="url(#primary)" stroke-width="2.5" filter="url(#glow)"/>
    <!-- F lettermark -->
    <rect x="52" y="46" width="14" height="66" rx="4" fill="url(#wordmark)"/>
    <rect x="52" y="46" width="42" height="13" rx="4" fill="url(#wordmark)"/>
    <rect x="52" y="68" width="33" height="11" rx="4" fill="url(#wordmark)" opacity="0.85"/>
    <!-- L lettermark -->
    <rect x="100" y="68" width="10" height="44" rx="3" fill="url(#accent)"/>
    <rect x="100" y="102" width="26" height="10" rx="3" fill="url(#accent)"/>
    <!-- Spark dot -->
    <circle cx="126" cy="40" r="6" fill="url(#spark)" filter="url(#glow)"/>
  </g>

  <!-- ── Wordmark ── -->
  <!-- "Fozzy" — bold white/violet -->
  <text x="176" y="110"
        font-family="'SF Pro Display','Helvetica Neue',Arial,sans-serif"
        font-size="72" font-weight="800" letter-spacing="-1"
        fill="url(#wordmark)">Fozzy</text>

  <!-- "Labs" — lighter cyan accent -->
  <text x="176" y="148"
        font-family="'SF Pro Display','Helvetica Neue',Arial,sans-serif"
        font-size="28" font-weight="300" letter-spacing="8"
        fill="url(#accent)" opacity="0.85">LABS</text>

  <!-- Subtle tagline -->
  <text x="176" y="172"
        font-family="'SF Pro Text','Helvetica Neue',Arial,sans-serif"
        font-size="13" font-weight="400" letter-spacing="2"
        fill="#FFFFFF" opacity="0.25">Mobile Games &amp; Apps</text>

  <!-- Decorative orbit arc -->
  <ellipse cx="560" cy="100" rx="80" ry="36"
           fill="none" stroke="url(#primary)" stroke-width="1.5"
           stroke-dasharray="8,5" opacity="0.25"
           transform="rotate(-20, 560, 100)"/>
  <circle cx="604" cy="74" r="5" fill="url(#accent)" opacity="0.6"/>
  <circle cx="516" cy="124" r="4" fill="url(#spark)" opacity="0.5"/>

  <!-- Version / divider line -->
  <rect x="680" y="40" width="1" height="120" fill="#FFFFFF" fill-opacity="0.06"/>
  <!-- Social handle -->
  <text x="700" y="92" font-family="'Helvetica Neue',Arial,sans-serif"
        font-size="12" fill="#FFFFFF" opacity="0.20">@fozzylabs</text>
  <text x="700" y="112" font-family="'Helvetica Neue',Arial,sans-serif"
        font-size="12" fill="#FFFFFF" opacity="0.20">fozzylabs.com</text>
</svg>
